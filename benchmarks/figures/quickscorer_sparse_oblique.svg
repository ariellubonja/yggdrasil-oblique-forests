<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C97A3"/></marker></defs>
<rect width="1000" height="700" fill="#FFFFFF"/>
<text x="500.0" y="34" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#2B2F33" text-anchor="middle" font-weight="bold" font-style="normal">Why QuickScorer cannot serve sparse-oblique splits</text>
<text x="40" y="76" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#2E5E9C" text-anchor="start" font-weight="bold" font-style="normal">A — axis-aligned: what QuickScorer requires</text>
<rect x="40" y="96" width="180" height="44" rx="6" fill="#E8EFF8" stroke="#2E5E9C" stroke-width="1.6"/>
<text x="52" y="114" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">tree 1, node a</text>
<text x="52" y="132" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">x₃ ≥ 0.4</text>
<rect x="40" y="152" width="180" height="44" rx="6" fill="#E8EFF8" stroke="#2E5E9C" stroke-width="1.6"/>
<text x="52" y="170" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">tree 2, node f</text>
<text x="52" y="188" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">x₃ ≥ 2.6</text>
<rect x="40" y="208" width="180" height="44" rx="6" fill="#E8EFF8" stroke="#2E5E9C" stroke-width="1.6"/>
<text x="52" y="226" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">tree 7, node c</text>
<text x="52" y="244" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">x₃ ≥ 1.1</text>
<line x1="224" y1="118" x2="320" y2="172" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="224" y1="174" x2="320" y2="172" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="224" y1="230" x2="320" y2="172" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="258" y="250" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="middle" font-weight="normal" font-style="normal">compile:</text>
<text x="258" y="264" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="middle" font-weight="normal" font-style="normal">bucket by feature</text>
<rect x="330" y="96" width="290" height="156" rx="6" fill="#F7F7F5" stroke="#2E5E9C" stroke-width="1.6"/>
<text x="345" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2E5E9C" text-anchor="start" font-weight="bold" font-style="normal">bucket of feature x₃</text>
<text x="345" y="134" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="italic">thresholds sorted once, offline</text>
<text x="360" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">0.4</text>
<line x1="395" y1="153" x2="425" y2="153" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="435" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">leaf mask 101101</text>
<text x="360" y="186" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">1.1</text>
<line x1="395" y1="181" x2="425" y2="181" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="435" y="186" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">leaf mask 110111</text>
<text x="360" y="214" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">2.6</text>
<line x1="395" y1="209" x2="425" y2="209" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="435" y="214" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">leaf mask 011111</text>
<line x1="624" y1="174" x2="690" y2="174" stroke="#8C97A3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="700" y="96" width="260" height="156" rx="6" fill="#F2F8F4" stroke="#1C7A46" stroke-width="1.6"/>
<text x="715" y="120" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1C7A46" text-anchor="start" font-weight="bold" font-style="normal">score one example:</text>
<text x="715" y="144" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">• read x₃ once</text>
<text x="715" y="166" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">• one ascending scan, early exit</text>
<text x="715" y="188" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">• AND the leaf masks</text>
<text x="715" y="214" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">node ↔ one feature ↔ one constant:</text>
<text x="715" y="230" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">this pairing makes the layout possible</text>
<text x="40" y="316" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#B84E1F" text-anchor="start" font-weight="bold" font-style="normal">B — sparse oblique: both pillars break</text>
<rect x="40" y="336" width="250" height="52" rx="6" fill="#FBEFE7" stroke="#B84E1F" stroke-width="1.6"/>
<text x="52" y="356" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">node u</text>
<text x="52" y="376" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">0.7·x₃ − 1.2·x₁₇ ≥ 0.5</text>
<rect x="40" y="412" width="250" height="52" rx="6" fill="#FBEFE7" stroke="#B84E1F" stroke-width="1.6"/>
<text x="52" y="432" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">node v</text>
<text x="52" y="452" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">0.3·x₃ + 0.9·x₈ ≥ −0.2</text>
<rect x="400" y="336" width="120" height="40" rx="6" fill="#F7F7F5" stroke="#8C97A3" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="460" y="361" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="middle" font-weight="normal" font-style="normal">bucket x₃</text>
<rect x="400" y="392" width="120" height="40" rx="6" fill="#F7F7F5" stroke="#8C97A3" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="460" y="417" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="middle" font-weight="normal" font-style="normal">bucket x₈</text>
<rect x="400" y="448" width="120" height="40" rx="6" fill="#F7F7F5" stroke="#8C97A3" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="460" y="473" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="middle" font-weight="normal" font-style="normal">bucket x₁₇</text>
<line x1="294" y1="362" x2="396" y2="356" stroke="#B84E1F" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<line x1="294" y1="362" x2="396" y2="468" stroke="#B84E1F" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<line x1="294" y1="438" x2="396" y2="366" stroke="#B84E1F" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<line x1="294" y1="438" x2="396" y2="412" stroke="#B84E1F" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="345" y="408" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#B3261E" text-anchor="middle" font-weight="bold" font-style="normal">✗</text>
<text x="400" y="512" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#B3261E" text-anchor="start" font-weight="normal" font-style="normal">one node → several features:</text>
<text x="400" y="528" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#B3261E" text-anchor="start" font-weight="normal" font-style="normal">no single home bucket</text>
<rect x="580" y="336" width="380" height="152" rx="6" fill="#FFFFFF" stroke="#B84E1F" stroke-width="1.6"/>
<text x="595" y="360" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">① condition spans several features</text>
<text x="610" y="378" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">→ cannot be filed in a feature-major layout</text>
<text x="595" y="408" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">② compared value is a node-private dot</text>
<text x="595" y="426" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">product Σ wᵢ·xᵢ, not a raw feature</text>
<text x="610" y="444" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">→ thresholds of different nodes live on different</text>
<text x="610" y="460" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">axes: nothing shared to sort or scan; evaluating</text>
<text x="610" y="476" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8C97A3" text-anchor="start" font-weight="normal" font-style="normal">each node separately = ordinary tree traversal</text>
<rect x="40" y="560" width="920" height="100" rx="6" fill="#F7F7F5" stroke="#8C97A3" stroke-width="1.6"/>
<text x="56" y="586" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2B2F33" text-anchor="start" font-weight="bold" font-style="normal">What YDF does today</text>
<text x="56" y="608" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">kObliqueCondition is absent from the QuickScorer condition whitelist (AllConditionsCompatibleQuickScorerExtendedModels,</text>
<text x="56" y="626" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">serving/decision_forest/register_engines.cc) → IsCompatible() fails → the model falls back to the generic traversal engine, which</text>
<text x="56" y="644" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#2B2F33" text-anchor="start" font-weight="normal" font-style="normal">evaluates the dot product at every visited node (kNumericalObliqueProjectionIsHigher, decision_forest_serving.cc).</text>
</svg>
